<div class="chat-widget">
  <section
    *ngIf="abierto"
    class="chat-panel"
    role="dialog"
    aria-label="Asistente de OrientaLab">
    <header class="chat-header">
      <div class="chat-identidad">
        <span class="chat-avatar" aria-hidden="true">OL</span>
        <div>
          <h2>Asistente OrientaLab</h2>
          <span>Orientación laboral con IA</span>
        </div>
      </div>
      <button
        class="chat-cerrar"
        type="button"
        aria-label="Cerrar chat"
        (click)="abierto = false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    <div class="chat-mensajes" aria-live="polite" aria-relevant="additions">
      <div
        *ngFor="let mensaje of mensajes"
        class="chat-mensaje"
        [class.chat-mensaje-usuario]="mensaje.role === 'user'">
        <p>{{ mensaje.content }}</p>
      </div>
      <div *ngIf="enviando" class="chat-escribiendo" role="status">
        Preparando respuesta...
      </div>
      <p *ngIf="error" class="chat-error" role="alert">{{ error }}</p>
    </div>

    <form class="chat-formulario" (ngSubmit)="enviar()">
      <label class="sr-only" for="chat-input">Escribe tu consulta</label>
      <textarea
        id="chat-input"
        name="mensaje"
        [(ngModel)]="texto"
        rows="2"
        maxlength="2500"
        placeholder="Escribe tu consulta..."
        [disabled]="enviando"></textarea>
      <button
        type="submit"
        class="chat-enviar"
        aria-label="Enviar mensaje"
        [disabled]="!texto.trim() || enviando">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12h15M13 5l7 7-7 7" />
        </svg>
      </button>
    </form>
  </section>

  <button
    class="chat-lanzador"
    type="button"
    [attr.aria-expanded]="abierto"
    [attr.aria-label]="abierto ? 'Cerrar asistente' : 'Abrir asistente de IA'"
    (click)="abierto = !abierto">
    <svg *ngIf="!abierto" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.5-3A7.5 7.5 0 1 1 20 11.5Z" />
      <path d="M9 11h.01M12.5 11h.01M16 11h.01" />
    </svg>
    <svg *ngIf="abierto" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18" />
    </svg>
  </button>
</div>
